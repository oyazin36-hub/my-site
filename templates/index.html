<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>相見積もり比較アプリ</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header class="topbar no-print">
  <h1>相見積もり比較アプリ</h1>
  <span class="tag">PDFの品番・単価を自動読取り</span>
</header>

<!-- アップロード -->
<section class="panel no-print" id="upload-panel">
  <h2>① 見積書PDFをアップロード</h2>
  <p class="hint">各社の見積書PDFを選んでください（複数選択可）。スキャン画像のPDFでもOKです。</p>
  <form id="upload-form">
    <input type="file" id="pdfs" name="pdfs" accept="application/pdf" multiple required>
    <button type="submit" id="go">読み取る</button>
  </form>
  <div id="status" class="status"></div>
</section>

<!-- 結果 -->
<section id="result" class="hidden">

  <div class="panel no-print">
    <h2>② 社名と倍率を入力</h2>
    <p class="hint">人が入力するのはここだけ。倍率を変えると下の比較表が自動で再計算されます。</p>
    <div id="company-inputs" class="company-inputs"></div>
  </div>

  <div class="report-head">
    <div>
      <h2 class="rep-title">相見積もり比較表</h2>
      <div class="rep-sub" id="rep-sub"></div>
    </div>
    <button class="print-btn no-print" onclick="window.print()">🖨 A4で印刷</button>
  </div>

  <div class="table-wrap">
    <table id="compare">
      <thead id="compare-head"></thead>
      <tbody id="compare-body"></tbody>
    </table>
  </div>

  <div class="legend">
    <span><b class="ok">◎</b> 高信頼（複数回の読みが一致）</span>
    <span><b class="mid">○</b> 2回一致</span>
    <span><b class="warn">△</b> 要確認（読みがバラついた／読めず）</span>
    <span><b class="min-key">緑</b> 各品番の最安値</span>
    <span>単価セルはクリックで手修正できます。</span>
  </div>
</section>

<!-- 単価列を指定するモーダル -->
<div id="col-modal" class="modal hidden no-print">
  <div class="modal-box">
    <div class="modal-head">
      <span id="col-modal-title">単価の列を指定</span>
      <button class="modal-close" onclick="closeColPicker()" aria-label="閉じる">×</button>
    </div>
    <p class="hint">表に重ねた区切りのうち、<b>「単価」の列をクリック</b>してください。選んだ列で読み直します。</p>
    <div id="col-stage" class="col-stage"></div>
    <div class="modal-foot">
      <span id="col-sel-label" class="sel-label">列を選んでください</span>
      <button id="col-apply" disabled onclick="applyColumn()">この列で読み直す</button>
    </div>
  </div>
</div>

<script>
const UNIT_ROUND = 100;   // 計算結果は100円単位で切り上げ
let COMPANIES = [];

// --- アップロード処理 ---
document.getElementById('upload-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const files = document.getElementById('pdfs').files;
  if (!files.length) return;
  const fd = new FormData();
  for (const f of files) fd.append('pdfs', f);
  const status = document.getElementById('status');
  const btn = document.getElementById('go');
  btn.disabled = true;
  status.textContent = '読み取り中… （ページ数により数十秒かかります）';
  try {
    const res = await fetch('/analyze', { method: 'POST', body: fd });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || '失敗しました');
    COMPANIES = data.companies;
    status.textContent = '';
    renderInputs();
    renderTable();
    document.getElementById('result').classList.remove('hidden');
  } catch (err) {
    status.textContent = 'エラー: ' + err.message;
  } finally {
    btn.disabled = false;
  }
});

// --- 社名・倍率の入力欄 ---
function renderInputs() {
  const box = document.getElementById('company-inputs');
  box.innerHTML = '';
  COMPANIES.forEach((c, i) => {
    const priced = c.rows.filter(r => r.price != null).length;
    const div = document.createElement('div');
    div.className = 'company-card';
    div.innerHTML = `
      <div class="cc-file">📄 ${escapeHtml(c.filename)}</div>
      <label>社名
        <input type="text" value="${escapeHtml(c.name)}" data-i="${i}" class="name-input">
      </label>
      <label>倍率
        <input type="number" step="0.01" min="0" value="${c.multiplier}" data-i="${i}" class="mult-input">
      </label>
      <div class="cc-stat">品番 ${c.rows.length} 件 / 単価読取 ${priced} 件
        ${needCheck(c) ? `<span class="cc-warn">（要確認 ${needCheck(c)} 件）</span>` : ''}</div>
      <button class="col-btn no-print" data-i="${i}">単価列を指定して読み直す</button>
    `;
    box.appendChild(div);
  });
  box.querySelectorAll('.name-input').forEach(el =>
    el.addEventListener('input', e => { COMPANIES[e.target.dataset.i].name = e.target.value; renderTable(); }));
  box.querySelectorAll('.mult-input').forEach(el =>
    el.addEventListener('input', e => { COMPANIES[e.target.dataset.i].multiplier = parseFloat(e.target.value) || 0; renderTable(); }));
  box.querySelectorAll('.col-btn').forEach(el =>
    el.addEventListener('click', e => openColumnPicker(parseInt(e.target.dataset.i, 10))));
}

// 要確認(△ or 未読)の件数
function needCheck(c) {
  return c.rows.filter(r => !r.flag && (r.price == null || r.conf === '△')).length;
}

function roundUp(value, unit) { return Math.ceil(value / unit) * unit; }
function yen(v) { return v == null ? '' : '¥' + v.toLocaleString(); }
function escapeHtml(s) { return String(s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }

// --- 比較表を組み立てる ---
function renderTable() {
  // 全社の品番を結合（共通キーでマッチング）
  const keys = [];
  const seen = new Set();
  COMPANIES.forEach(c => c.rows.forEach(r => { if (!seen.has(r.key)) { seen.add(r.key); keys.push(r.key); } }));
  const lookup = COMPANIES.map(c => {
    const m = {}; c.rows.forEach(r => m[r.key] = r); return m;
  });

  // ヘッダ
  let head = '<tr><th class="pn-col">品番</th>';
  COMPANIES.forEach(c => {
    head += `<th>${escapeHtml(c.name)}<br><span class="th-sub">単価</span></th>`;
    head += `<th>${escapeHtml(c.name)}<br><span class="th-sub">×${c.multiplier}</span></th>`;
  });
  head += '<th>最安</th></tr>';
  document.getElementById('compare-head').innerHTML = head;

  // 本体
  let body = '';
  keys.forEach(key => {
    const finals = [];
    COMPANIES.forEach((c, ci) => {
      const r = lookup[ci][key];
      if (r && r.price != null) finals.push({ ci, val: roundUp(r.price * c.multiplier, UNIT_ROUND) });
    });
    const min = finals.length ? Math.min(...finals.map(f => f.val)) : null;

    let tr = `<tr><td class="pn">${escapeHtml(key)}</td>`;
    COMPANIES.forEach((c, ci) => {
      const r = lookup[ci][key];
      if (!r) { tr += `<td class="num muted">なし</td><td class="num"></td>`; return; }
      if (r.flag) { tr += `<td class="num muted">除外</td><td class="num"></td>`; return; }
      const conf = r.conf || '';
      const badge = conf === '◎' ? '<span class="ok">◎</span>' :
                    conf === '○' ? '<span class="mid">○</span>' :
                    (r.price != null ? '<span class="warn">△</span>' : '');
      const warnCls = (conf === '△' || r.price == null) ? ' warncell' : '';
      const unitTxt = r.price != null ? yen(r.price) : '<span class="need">要確認</span>';
      // 単価セル（クリックで手修正）
      tr += `<td class="num unit${warnCls}" data-ci="${ci}" data-key="${escapeHtml(key)}"
                 title="クリックで修正">${badge}<span class="uval">${unitTxt}</span>` +
            (r.cell ? `<img class="cell-img" src="${r.cell}" alt="原本">` : '') + `</td>`;
      // 計算結果
      const fin = r.price != null ? roundUp(r.price * c.multiplier, UNIT_ROUND) : null;
      const isMin = fin != null && fin === min;
      tr += `<td class="num ${isMin ? 'min' : ''}">${fin != null ? yen(fin) : ''}</td>`;
    });
    // 最安社
    const minCompanies = finals.filter(f => f.val === min).map(f => COMPANIES[f.ci].name);
    tr += `<td class="cheap">${min != null ? escapeHtml(minCompanies.join(', ')) : '—'}</td></tr>`;
    body += tr;
  });
  document.getElementById('compare-body').innerHTML = body;
  bindEdit();

  // 見出し
  const sub = COMPANIES.map(c => `${escapeHtml(c.name)}×${c.multiplier}`).join('　');
  document.getElementById('rep-sub').textContent =
    `倍率 ${sub} ／ 計算は100円単位で切り上げ ／ 全${keys.length}品番`;
}

// --- 単価セルをクリックで修正 ---
function bindEdit() {
  document.querySelectorAll('td.unit').forEach(td => {
    td.addEventListener('click', () => {
      if (td.querySelector('input')) return;
      const ci = td.dataset.ci, key = td.dataset.key;
      const row = COMPANIES[ci].rows.find(r => r.key === key);
      const cur = row && row.price != null ? row.price : '';
      td.innerHTML = `<input type="number" step="10" value="${cur}" class="edit-input">`;
      const inp = td.querySelector('input');
      inp.focus();
      const commit = () => {
        const v = inp.value === '' ? null : parseInt(inp.value, 10);
        row.price = (v != null && !isNaN(v)) ? v : null;
        row.conf = row.price != null ? '手' : '';   // 手修正マーク
        renderTable();
      };
      inp.addEventListener('blur', commit);
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') inp.blur(); });
    });
  });
}

// --- 単価列を手動指定 ---
let pickState = { ci: null, columns: [], selected: null };

async function openColumnPicker(i) {
  const c = COMPANIES[i];
  pickState = { ci: i, columns: [], selected: null };
  document.getElementById('col-modal-title').textContent = `${c.name}：単価の列を指定`;
  document.getElementById('col-sel-label').textContent = '列を選んでください';
  document.getElementById('col-apply').disabled = true;
  const stage = document.getElementById('col-stage');
  stage.innerHTML = '<div class="loading">読み込み中…</div>';
  document.getElementById('col-modal').classList.remove('hidden');
  try {
    const res = await fetch('/preview/' + c.file_id);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || '失敗');
    pickState.columns = data.columns;
    renderStage(data.image, data.columns);
  } catch (e) {
    stage.innerHTML = '<div class="loading">プレビュー取得に失敗: ' + escapeHtml(e.message) + '</div>';
  }
}

function renderStage(imgUri, columns) {
  const stage = document.getElementById('col-stage');
  stage.innerHTML = '';
  const wrap = document.createElement('div');
  wrap.className = 'col-imgwrap';
  const img = document.createElement('img');
  img.className = 'col-img';
  img.src = imgUri;
  wrap.appendChild(img);
  img.onload = () => {
    columns.forEach(frac => {
      const line = document.createElement('div');
      line.className = 'col-line';
      line.style.left = (frac * 100) + '%';
      wrap.appendChild(line);
    });
    for (let k = 0; k < columns.length - 1; k++) {
      const band = document.createElement('div');
      band.className = 'col-band';
      band.style.left = (columns[k] * 100) + '%';
      band.style.width = ((columns[k + 1] - columns[k]) * 100) + '%';
      band.dataset.index = k;
      band.title = `列 ${k + 1}`;
      band.addEventListener('click', () => selectBand(k));
      wrap.appendChild(band);
    }
  };
  stage.appendChild(wrap);
}

function selectBand(k) {
  pickState.selected = k;
  document.querySelectorAll('.col-band').forEach(b =>
    b.classList.toggle('selected', parseInt(b.dataset.index, 10) === k));
  document.getElementById('col-sel-label').textContent = `列 ${k + 1} を選択中（ここを単価として読みます）`;
  document.getElementById('col-apply').disabled = false;
}

async function applyColumn() {
  const i = pickState.ci;
  if (i == null || pickState.selected == null) return;
  const c = COMPANIES[i];
  const btn = document.getElementById('col-apply');
  btn.disabled = true; btn.textContent = '読み直し中…';
  try {
    const res = await fetch('/recolumn', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ file_id: c.file_id, col_index: pickState.selected })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || '失敗');
    c.rows = data.rows;
    c.columns = data.columns;
    renderInputs();
    renderTable();
    closeColPicker();
  } catch (e) {
    alert('エラー: ' + e.message);
  } finally {
    btn.textContent = 'この列で読み直す';
  }
}

function closeColPicker() {
  document.getElementById('col-modal').classList.add('hidden');
}
</script>
</body>
</html>

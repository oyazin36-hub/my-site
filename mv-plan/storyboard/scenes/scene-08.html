<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>08 Bメロ2</title>
<link rel="stylesheet" href="base.css">
<style>
.ic { position:absolute; top:150px; width:440px; text-align:center; }
.ic .lbl { font-weight:700; font-size:56px; letter-spacing:.2em; margin-top:26px; padding-left:.2em; }
.ic .en { font-size:16px; letter-spacing:.4em; color:var(--silver); margin-top:6px; }
.badge { position:absolute; right:96px; top:72px; display:flex; align-items:center; gap:14px; padding:12px 20px; border:1px solid var(--silver); }
.badge b { font-size:24px; letter-spacing:.14em; font-weight:700; }
.badge span { font-size:14px; letter-spacing:.24em; color:var(--silver); }
</style></head><body>
<div class="frame" id="fr"></div>
<script>
const f = new URLSearchParams(location.search).get('f') || 'a';
const fr = document.getElementById('fr');
const T = (x,y,s,t,o='')=>`<text x="${x}" y="${y}" fill="#C9D2DE" font-family="Zen Kaku" font-size="${s}" letter-spacing="3" ${o}>${t}</text>`;
const bg = `<div style="position:absolute;inset:0;background:radial-gradient(1500px 900px at 50% 40%,#1b2741,#0E1626 70%)"></div>
 <svg width="1920" height="1080" style="position:absolute;inset:0"><defs><pattern id="gr" width="60" height="60" patternUnits="userSpaceOnUse"><path d="M60 0H0V60" fill="none" stroke="#1f2b43"/></pattern></defs><rect width="1920" height="1080" fill="url(#gr)" opacity=".8"/></svg>`;
if (f === 'a') {
  const check = (on)=>`<g transform="translate(150,150)"><circle r="34" fill="#0E1626" stroke="${on?'#F4F6FA':'#C9D2DE'}" stroke-width="2"/><path d="M-15 1 L-4 12 L17 -11" fill="none" stroke="#F4F6FA" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g>`;
  const ring = `<circle cx="0" cy="0" r="118" fill="none" stroke="#3A4A63"/><circle cx="0" cy="0" r="118" fill="none" stroke="#C9D2DE" stroke-width="2" stroke-dasharray="560 1000" transform="rotate(-90)"/>
    ${Array.from({length:36},(_,i)=>`<line x1="0" y1="-128" x2="0" y2="${i%3?-132:-138}" stroke="#3A4A63" transform="rotate(${i*10})"/>`).join('')}`;
  // 品質: micrometer/caliper-ish gauge with diamond
  const q = `<g fill="none" stroke="#F4F6FA" stroke-width="2.5" stroke-linejoin="round">
     <polygon points="-46,-22 -26,-46 26,-46 46,-22 0,44"/><path d="M-46 -22 H46 M-26 -46 L-12 -22 L0 44 M26 -46 L12 -22 L0 44 M-12 -22 L0 -46 L12 -22" stroke-width="1.4"/></g>
     <line x1="-70" y1="62" x2="70" y2="62" stroke="#C9D2DE"/>${[-70,-35,0,35,70].map(x=>`<line x1="${x}" y1="56" x2="${x}" y2="68" stroke="#C9D2DE"/>`).join('')}`;
  // コスト: bar chart descending with yen
  const c = `<g fill="none" stroke="#F4F6FA" stroke-width="2.5"><rect x="-62" y="-40" width="26" height="86"/><rect x="-22" y="-14" width="26" height="60"/><rect x="18" y="8" width="26" height="38"/>
     <path d="M-76 46 H70" stroke="#C9D2DE" stroke-width="1.5"/><path d="M-50 -62 L30 -12 M30 -12 l-4 -16 M30 -12 l-16 4" stroke-width="2"/></g>
     <text x="54" y="-40" fill="#F4F6FA" font-family="Zen Kaku" font-weight="700" font-size="34">¥</text>`;
  // 納期: clock + calendar
  const d = `<g fill="none" stroke="#F4F6FA" stroke-width="2.5"><rect x="-66" y="-50" width="104" height="96" rx="4"/><line x1="-66" y1="-24" x2="38" y2="-24"/><line x1="-40" y1="-62" x2="-40" y2="-40"/><line x1="12" y1="-62" x2="12" y2="-40"/></g>
     <g stroke="#C9D2DE" stroke-width="1.2">${[0,1,2].map(r=>[0,1,2,3].map(k=>`<rect x="${-54+k*22}" y="${-14+r*18}" width="12" height="9" fill="none"/>`).join('')).join('')}</g>
     <circle cx="44" cy="34" r="30" fill="#0E1626" stroke="#F4F6FA" stroke-width="2.5"/><path d="M44 16 V34 L58 42" fill="none" stroke="#F4F6FA" stroke-width="2.5" stroke-linecap="round"/>`;
  const items = [['品質','QUALITY',q,true],['コスト','COST',c,true],['納期','DELIVERY',d,true]];
  const xs = [380, 960, 1540];
  fr.innerHTML = bg + items.map((it,i)=>`<div class="ic" style="left:${xs[i]-220}px">
     <svg width="440" height="300" viewBox="-220 -150 440 300" style="overflow:visible">${ring}${it[2]}<g transform="translate(-65,-65)">${check(it[3])}</g>
       <g transform="translate(-220,-150)"></g></svg>
     <div class="lbl">${it[0]}</div><div class="en">${it[1]}</div></div>`).join('') +
   `<svg width="1920" height="1080" style="position:absolute;inset:0;pointer-events:none">
      <g stroke="#3A4A63" stroke-dasharray="2 8"><line x1="670" y1="300" x2="1250" y2="300"/></g>
      <g stroke="#3A4A63" stroke-dasharray="2 8"><line x1="510" y1="300" x2="830" y2="300"/><line x1="1090" y1="300" x2="1410" y2="300"/></g>
      ${T(960,700,18,'CHECK 3 / 3　―　ALL CLEAR','text-anchor="middle" letter-spacing="8"')}
      <line x1="760" y1="720" x2="1160" y2="720" stroke="#C9D2DE" opacity=".5"/>
      <line x1="760" y1="720" x2="1160" y2="720" stroke="#E8A33D" stroke-width="1" opacity=".0"/>
    </svg>
    <div class="badge"><svg width="34" height="34" viewBox="-17 -17 34 34"><circle r="15" fill="none" stroke="#C9D2DE" stroke-width="1.5"/><path d="M-7 0 L-2 5 L8 -6" fill="none" stroke="#F4F6FA" stroke-width="2.4" stroke-linecap="round"/></svg><div><b class="mono">ISO9001</b><br><span>認証取得 2021</span></div></div>
    <div class="lyric">納期を守る</div>`;
} else {
  // blocks stacked into factory silhouette. unit 40px grid; ground y=780
  const G = 780, U = 40;
  // layout: columns from x=360..1560 ; define rects in grid units [x,y(from ground),w,h]
  const blocks = [];
  // main hall: two rows of base blocks
  const row = (y, xs) => xs.forEach(([x,w]) => blocks.push([x, y, w, 1]));
  row(0, [[9,4],[13,3],[16,4],[20,3],[23,4],[27,3],[30,4],[34,3],[37,4],[41,3],[44,4]]);
  row(1, [[9,3],[12,4],[16,3],[19,4],[23,3],[26,4],[30,3],[33,4],[37,3],[40,4],[44,4]]);
  row(2, [[9,4],[13,3],[16,4],[20,3],[23,4],[27,3],[30,4],[34,3],[37,4],[41,3],[44,4]]);
  row(3, [[9,3],[12,4],[16,3],[19,4],[23,3],[26,4],[30,3],[33,4],[37,3],[40,4],[44,4]]);
  // office tower left (x 9-16) taller
  row(4, [[9,4],[13,3]]); row(5, [[9,3],[12,4]]); row(6, [[9,4],[13,3]]); row(7,[[9,3],[12,4]]);
  blocks.push([10,8,5,1,'cap']);
  // sawtooth roof over 16-48 : triangles as wedge blocks
  const saw = [];
  for (let k = 0; k < 3; k++) saw.push(16 + k*8);
  // gantry-crane hall tall right 40-48 extra row
  row(4, [[40,4],[44,4]]); row(5, [[40,3],[43,5]]);
  // falling last block (tilted) top
  const px = (gx)=>gx*U-180, py=(gy)=>G-(gy+1)*U;
  let svg = `<defs>
     <linearGradient id="mb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d7dee8"/><stop offset=".08" stop-color="#9aa6b8"/><stop offset=".55" stop-color="#5c6a80"/><stop offset="1" stop-color="#3b475a"/></linearGradient>
     <linearGradient id="mb2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c3ccd8"/><stop offset=".5" stop-color="#7a879b"/><stop offset="1" stop-color="#46536a"/></linearGradient>
     <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0" gradientUnits="userSpaceOnUse" gradientTransform="rotate(18 960 500)"><stop offset="0" stop-color="#E8A33D" stop-opacity="0"/><stop offset=".40" stop-color="#E8A33D" stop-opacity="0"/><stop offset=".455" stop-color="#E8A33D" stop-opacity=".5"/><stop offset=".47" stop-color="#FFF3DC" stop-opacity=".8"/><stop offset=".485" stop-color="#E8A33D" stop-opacity=".45"/><stop offset=".54" stop-color="#E8A33D" stop-opacity="0"/></linearGradient>
     <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C9D2DE" stop-opacity=".18"/><stop offset="1" stop-color="#C9D2DE" stop-opacity="0"/></linearGradient>
   </defs><g transform="translate(-0,0)">`;
  const blk = ([x,y,w,h,k], fill='url(#mb)') => `<rect x="${px(x)+1.5}" y="${py(y)+1.5}" width="${w*U-3}" height="${h*U-3}" rx="1.5" fill="${fill}" stroke="#0E1626" stroke-width="1"/><line x1="${px(x)+3}" y1="${py(y)+2.5}" x2="${px(x)+w*U-3}" y2="${py(y)+2.5}" stroke="#F4F6FA" stroke-opacity=".7"/>`;
  let shapes = blocks.map(b=>blk(b)).join('');
  // sawtooth wedges on top of row 3 (gy=4 base) from x16..40
  for (const sx of saw) {
    const x0 = px(sx), y0 = py(3)-0, x1 = px(sx+8);
    shapes += `<polygon points="${x0+1.5},${y0-1.5} ${x0+1.5},${y0-2*U} ${x1-1.5},${y0-1.5}" fill="url(#mb2)" stroke="#0E1626"/><line x1="${x0+2}" y1="${y0-2*U+2}" x2="${x1-4}" y2="${y0-3}" stroke="#F4F6FA" stroke-opacity=".6"/>`;
    shapes += `<rect x="${x0+1.5}" y="${y0-2*U}" width="6" height="${2*U-2}" fill="#d7dee8" opacity=".5"/>`;
  }
  // falling block
  shapes += `<g transform="rotate(-8 ${px(42)} ${py(9)})">${blk([41,9,3,1])}</g>`;
  svg += `<g id="all">${shapes}</g>
     <g style="mix-blend-mode:screen">${shapes.replace(/fill="url\(#mb2?\)"/g,'fill="url(#sheen)"').replace(/fill="#d7dee8"/g,'fill="none"').replace(/stroke="#F4F6FA"[^/]*\/>/g,'/>')}</g>
     <rect x="200" y="${G}" width="1520" height="120" fill="url(#floor)"/>
     <line x1="160" y1="${G}" x2="1760" y2="${G}" stroke="#C9D2DE" stroke-width="1.2"/>
     <!-- ghost guide of falling path -->
     <g stroke="#C9D2DE" stroke-dasharray="3 7" opacity=".6"><line x1="${px(42.5)}" y1="${py(9)-60}" x2="${px(42.5)}" y2="${py(9)-10}"/><rect x="${px(41)+1.5}" y="${py(6)+1.5}" width="${3*U-3}" height="${U-3}" fill="none" stroke-dasharray="4 4"/></g>
     <!-- dims -->
     <g stroke="#C9D2DE" opacity=".7"><line x1="${px(9)}" y1="${G+30}" x2="${px(48)}" y2="${G+30}"/><line x1="${px(9)}" y1="${G+22}" x2="${px(9)}" y2="${G+38}"/><line x1="${px(48)}" y1="${G+22}" x2="${px(48)}" y2="${G+38}"/>
       <line x1="${px(8)-30}" y1="${G}" x2="${px(8)-30}" y2="${py(8)}"/><line x1="${px(8)-38}" y1="${py(8)}" x2="${px(8)-22}" y2="${py(8)}"/></g>
     ${T(px(28.5),G+24,16,'1948 ― 2026','text-anchor="middle" letter-spacing="8"')}
     ${T(px(8)-44,(G+py(8))/2,16,'9 段','text-anchor="end"')}
     ${T(160,120,18,'ONE BY ONE ― 一つひとつの仕事から','letter-spacing="6"')}
     ${T(1760,120,18,'BLOCKS 096 / 097','text-anchor="end" letter-spacing="6"')}
   </g>`;
  fr.innerHTML = bg + `<svg width="1920" height="1080" style="position:absolute;inset:0">${svg}</svg>
     <div class="logo" style="position:absolute;left:${9*40-180}px;top:${780-9*40-60}px;font-size:28px;color:var(--silver)">原マシナリー</div>
     <div class="lyric">積み上げていく</div>`;
}
</script></body></html>

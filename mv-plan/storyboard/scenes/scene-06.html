<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>06 間奏</title>
<link rel="stylesheet" href="base.css">
<style>
.plate { position:absolute; left:160px; top:200px; width:1600px; height:620px; border-radius:6px; overflow:hidden;
  background:
    linear-gradient(100deg, rgba(255,255,255,0) 30%, rgba(255,255,255,.18) 46%, rgba(255,255,255,0) 60%),
    repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 1px, rgba(0,0,0,.04) 1px 2px, rgba(255,255,255,0) 2px 3px),
    linear-gradient(180deg, #8d98a8 0%, #a9b3c1 30%, #7f8a9b 62%, #9aa4b3 100%);
  box-shadow: 0 40px 80px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.6), inset 0 -1px 0 rgba(0,0,0,.4); }
.layer { position:absolute; inset:0; }
.slice { position:absolute; left:0; width:1920px; overflow:hidden; }
</style></head><body>
<div class="frame" id="fr"></div>
<script>
const f = new URLSearchParams(location.search).get('f') || 'a';
// deterministic RNG
let s = 7; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
// waveform bars (144BPM-ish envelope)
const N = 220, W = 1360, x0 = 120, cy = 300;
let bars = [];
for (let i = 0; i < N; i++) {
  const t = i / N;
  const beat = Math.pow(Math.abs(Math.sin(t * Math.PI * 16)), 6);
  const env = 0.35 + 0.65 * Math.sin(t * Math.PI) ;
  const a = (0.18 + 0.55 * beat + 0.27 * rnd()) * env * 190;
  bars.push([x0 + t * W, a]);
}
const barPath = bars.map(([x, a]) => `M${x.toFixed(1)} ${(cy - a).toFixed(1)}V${(cy + a).toFixed(1)}`).join('');
let line = 'M' + bars.map(([x, a], i) => `${x.toFixed(1)} ${(cy - a * (i % 2 ? 0.55 : -0.55)).toFixed(1)}`).join(' L');
function plate(variant) {
  const tint = variant || '';
  return `<div class="plate">
   <svg width="1600" height="620" style="position:absolute;inset:0">
     <defs><filter id="nz${tint}"><feTurbulence type="fractalNoise" baseFrequency="0.9 0.006" numOctaves="2" seed="3"/><feColorMatrix values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.55  0 0 0 .22 0"/></filter></defs>
     <rect width="1600" height="620" filter="url(#nz${tint})"/>
     <!-- engraved frame + ticks -->
     <rect x="60" y="50" width="1480" height="520" fill="none" stroke="rgba(30,40,58,.55)" stroke-width="1.2"/>
     <rect x="60" y="51.5" width="1480" height="520" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="1"/>
     ${Array.from({length: 69}, (_, i) => `<line x1="${120 + i * 20}" y1="540" x2="${120 + i * 20}" y2="${i % 4 ? 548 : 556}" stroke="rgba(30,40,58,.6)"/>`).join('')}
     <line x1="120" y1="${cy}" x2="1480" y2="${cy}" stroke="rgba(30,40,58,.35)" stroke-width="1"/>
     <!-- engraved waveform: light lip below, dark groove, highlight -->
     <path d="${barPath}" stroke="rgba(255,255,255,.55)" stroke-width="2.4" transform="translate(1,1.6)"/>
     <path d="${barPath}" stroke="#2a3446" stroke-width="2.4"/>
     <path d="${barPath}" stroke="rgba(14,22,38,.8)" stroke-width="0.8" transform="translate(-.5,-.5)"/>
     <!-- engraved logo -->
     <text x="80" y="104" font-family="Dela" font-size="30" letter-spacing="5" fill="rgba(255,255,255,.45)" transform="translate(1,1.5)">原マシナリー</text>
     <text x="80" y="104" font-family="Dela" font-size="30" letter-spacing="5" fill="#2f3a4d">原マシナリー</text>
     <text x="1520" y="100" text-anchor="end" font-family="Zen Kaku" font-size="16" letter-spacing="4" fill="#2f3a4d">♩=144　1:38 – 1:45</text>
     
   </svg></div>`;
}
const fr = document.getElementById('fr');
const bg = `<div class="layer" style="background:radial-gradient(1400px 900px at 50% 45%,#1d2a42,#0E1626 70%)"></div>
  <svg width="1920" height="1080" style="position:absolute;inset:0"><g stroke="#3A4A63" stroke-width="1" opacity=".7">
   <line x1="160" y1="160" x2="1760" y2="160"/><line x1="160" y1="150" x2="160" y2="170"/><line x1="1760" y1="150" x2="1760" y2="170"/>
   <line x1="120" y1="200" x2="120" y2="820"/><line x1="110" y1="200" x2="130" y2="200"/><line x1="110" y1="820" x2="130" y2="820"/></g>
   
   
  </svg>`;
if (f === 'a') {
  fr.innerHTML = bg + plate() +
   `<div class="mono" style="position:absolute;left:160px;top:860px;font-size:18px;color:var(--silver);letter-spacing:.4em">INTERLUDE ― ENGRAVED WAVEFORM</div>`;
} else {
  const full = bg + plate();
  // horizontal slices with offsets
  const cuts = [0, 210, 262, 300, 388, 430, 470, 560, 610, 680, 742, 790, 860, 1080];
  const off = [0, -46, 22, 0, 64, -18, 0, -90, 34, 0, 18, -40, 0];
  let html = '';
  for (let i = 0; i < cuts.length - 1; i++) {
    html += `<div class="slice" style="top:${cuts[i]}px;height:${cuts[i+1]-cuts[i]}px"><div style="position:absolute;left:${off[i]}px;top:${-cuts[i]}px;width:1920px;height:1080px">${full.replace(/id="nz"/,'id="nz'+i+'"').replace(/url\(#nz\)/,'url(#nz'+i+')')}</div></div>`;
  }
  // restrained chromatic split: amber + silver ghosts of the waveform, only in some bands
  const ghost = (dx, col, top, h) => `<div class="slice" style="top:${top}px;height:${h}px;mix-blend-mode:screen;opacity:.5">
     <svg width="1920" height="1080" style="position:absolute;left:${dx}px;top:${-top}px"><path d="${barPath}" stroke="${col}" stroke-width="2.4" fill="none" transform="translate(160,200)"/></svg></div>`;
  html += ghost(-58, '#E8A33D', 388, 82) + ghost(76, '#C9D2DE', 388, 82)
        + ghost(-104, '#E8A33D', 560, 50) + ghost(-70, '#C9D2DE', 560, 50)
        + ghost(30, '#E8A33D', 262, 38);
  // scan bars
  html += `<div style="position:absolute;left:0;right:0;top:300px;height:2px;background:rgba(244,246,250,.7)"></div>
    <div style="position:absolute;left:420px;width:900px;top:470px;height:6px;background:rgba(201,210,222,.25)"></div>
    <div style="position:absolute;left:0;right:0;top:742px;height:1px;background:rgba(232,163,61,.8)"></div>
    <div style="position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.12) 0 1px,transparent 1px 4px)"></div>
    <div class="mono" style="position:absolute;left:160px;top:860px;font-size:18px;color:var(--silver);letter-spacing:.4em">INTERLUDE ― TRANSITION ▸ A MELO 3</div>`;
  fr.innerHTML = html;
}
</script></body></html>

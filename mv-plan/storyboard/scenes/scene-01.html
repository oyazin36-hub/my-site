<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
.steel{position:absolute;inset:0;
 background:
  radial-gradient(ellipse 70% 60% at 50% 48%, rgba(120,138,165,.13), rgba(14,22,38,0) 65%),
  repeating-linear-gradient(90deg, rgba(255,255,255,.018) 0 1px, rgba(0,0,0,0) 1px 3px),
  repeating-linear-gradient(90deg, rgba(0,0,0,.06) 0 2px, rgba(0,0,0,0) 2px 7px),
  linear-gradient(180deg,#0b111d,#141d2f 50%,#0a101b);}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse 75% 70% at 50% 50%, rgba(0,0,0,0) 40%, rgba(5,9,16,.85) 100%);}
svg{position:absolute;inset:0}
.hud{position:absolute;font-size:18px;color:#7f8da3;letter-spacing:.18em}
.hud b{color:var(--silver);font-weight:400}
</style></head><body><div class="frame">
<div class="steel"></div>
<svg id="s" width="1920" height="1080" viewBox="0 0 1920 1080"></svg>
<div class="vig"></div>
<div class="hud mono" style="left:96px;top:84px">G01 &nbsp;F1200 &nbsp;S8000</div>
<div class="hud mono" id="xy" style="right:96px;top:84px"></div>
<div class="hud mono" id="foot" style="left:96px;bottom:80px"></div>
</div>
<script>
const f=new URLSearchParams(location.search).get('f')||'a';
const s=document.getElementById('s');
const NS='http://www.w3.org/2000/svg';
function el(t,a,p=s){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e;}
const defs=el('defs',{});
defs.innerHTML=`
<linearGradient id="cut" x1="0" y1="0" x2="1" y2="0">
 <stop offset="0" stop-color="#2a364c"/><stop offset=".35" stop-color="#6d7d96"/>
 <stop offset=".52" stop-color="#e9eef5"/><stop offset=".62" stop-color="#c9d2de"/><stop offset="1" stop-color="#3a4a63"/></linearGradient>
<linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
 <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".46" stop-color="#C9D2DE" stop-opacity="0"/>
 <stop offset=".5" stop-color="#F4F6FA" stop-opacity=".55"/><stop offset=".515" stop-color="#E8A33D" stop-opacity=".35"/>
 <stop offset=".56" stop-color="#C9D2DE" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<linearGradient id="sheenH" x1="0" y1="0" x2="1" y2="0">
 <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".40" stop-color="#C9D2DE" stop-opacity="0"/>
 <stop offset=".47" stop-color="#F4F6FA" stop-opacity=".7"/><stop offset=".485" stop-color="#E8A33D" stop-opacity=".45"/>
 <stop offset=".50" stop-color="#F4F6FA" stop-opacity=".25"/><stop offset=".56" stop-color="#C9D2DE" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<radialGradient id="shad"><stop offset="0" stop-color="#000" stop-opacity=".7"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
<linearGradient id="mill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4f6fa"/><stop offset=".5" stop-color="#8a98ad"/><stop offset="1" stop-color="#2b374b"/></linearGradient>
`;
// fine grid hairlines
for(let x=96;x<=1824;x+=96)el('line',{x1:x,y1:0,x2:x,y2:1080,stroke:'#C9D2DE','stroke-opacity':.035});
for(let y=60;y<=1080;y+=96)el('line',{x1:0,y1:y,x2:1920,y2:y,stroke:'#C9D2DE','stroke-opacity':.035});
function endmill(cx,cy,r){
  el('ellipse',{cx:cx+18,cy:cy+26,rx:r*1.7,ry:r*1.5,fill:'url(#shad)'});
  el('circle',{cx,cy,r,fill:'url(#mill)',stroke:'#F4F6FA','stroke-opacity':.6,'stroke-width':1});
  for(let i=0;i<4;i++){const a=i*Math.PI/2+.4;
    el('path',{d:`M${cx} ${cy} Q${cx+Math.cos(a+.6)*r*.7} ${cy+Math.sin(a+.6)*r*.7} ${cx+Math.cos(a)*r} ${cy+Math.sin(a)*r}`,stroke:'#0E1626','stroke-width':3,fill:'none','stroke-opacity':.8});}
  el('circle',{cx,cy,r:r+14,fill:'none',stroke:'#C9D2DE','stroke-opacity':.25,'stroke-dasharray':'2 6'});
  el('line',{x1:cx-r-40,y1:cy,x2:cx+r+40,y2:cy,stroke:'#C9D2DE','stroke-opacity':.3});
  el('line',{x1:cx,y1:cy-r-40,x2:cx,y2:cy+r+40,stroke:'#C9D2DE','stroke-opacity':.3});
}
if(f==='a'){
  const y=560,x0=-40,x1=1180,w=56;
  // machined pass groove
  el('rect',{x:x0,y:y-w/2,width:x1-x0,height:w,fill:'url(#cut)',opacity:.55});
  el('rect',{x:x0,y:y-w/2,width:x1-x0,height:w,fill:'none',stroke:'#C9D2DE','stroke-opacity':.35,'stroke-width':1});
  // feed marks (arcs)
  for(let x=x0;x<x1;x+=7)el('path',{d:`M${x} ${y-w/2} A${w/2} ${w/2} 0 0 1 ${x} ${y+w/2}`,fill:'none',stroke:'#F4F6FA','stroke-opacity':.07});
  // sheen sweep across fresh face
  el('rect',{x:x0,y:y-w/2,width:x1-x0,height:w,fill:'url(#sheenH)'});
  // tool path center line luminous
  el('line',{x1:x0,y1:y,x2:x1,y2:y,stroke:'#F4F6FA','stroke-width':1.6,filter:'url(#glow)'});
  el('line',{x1:x1,y1:y,x2:1820,y2:y,stroke:'#C9D2DE','stroke-opacity':.35,'stroke-dasharray':'4 10'});
  // planned path faint (start of 1 stroke)
  el('path',{d:`M1820 ${y} L1820 300`,stroke:'#C9D2DE','stroke-opacity':.18,'stroke-dasharray':'4 10',fill:'none'});
  endmill(x1,y,w/2+4);
  el('text',{x:x1+60,y:y-48,fill:'#C9D2DE','font-size':18,'letter-spacing':'.16em','font-family':'Zen Kaku'}).textContent='T01  φ16  END MILL';
  document.getElementById('xy').innerHTML='X <b>1180.000</b> &nbsp;Y <b>560.000</b> &nbsp;Z <b>-0.020</b>';
  document.getElementById('foot').innerHTML='PASS 001 / 214';
} else {
  const g=el('g',{});
  const T=(sw,col,op,extra={})=>{const t=el('text',Object.assign({x:960,y:690,'text-anchor':'middle','font-family':'Dela','font-size':420,'letter-spacing':'.06em',fill:'none',stroke:col,'stroke-width':sw,'stroke-opacity':op,'stroke-linejoin':'round'},extra),g);t.textContent='1948';return t;};
  // pocket floor: fill with machined finish
  T(0,'none',0,{fill:'url(#cut)','fill-opacity':.22});
  // offset contour tool paths (concentric strokes inward/outward)
  const offs=[46,34,22,10];
  offs.forEach((w,i)=>{T(w,'#C9D2DE',.10+i*.03);T(w-2,'#141d30',1);});
  T(1.4,'#F4F6FA',1,{filter:'url(#glow)'});
  // inner offsets via clip: draw text clipped fill rings
  defs.innerHTML+=`<clipPath id="tc"><text x="960" y="690" text-anchor="middle" font-family="Dela" font-size="420" letter-spacing=".06em">1948</text></clipPath>`;
  const inner=el('g',{'clip-path':'url(#tc)'});
  [36,24,12].forEach((w,i)=>{T(w,'#E8EEF6',.5-i*.1,{}).remove();});
  [40,26,12].forEach((w,i)=>{const t=el('text',{x:960,y:690,'text-anchor':'middle','font-family':'Dela','font-size':420,'letter-spacing':'.06em',fill:'none',stroke:'#C9D2DE','stroke-opacity':.55-i*.12,'stroke-width':w},inner);t.textContent='1948';
    const t2=el('text',{x:960,y:690,'text-anchor':'middle','font-family':'Dela','font-size':420,'letter-spacing':'.06em',fill:'none',stroke:'#1a2438','stroke-width':w-2.4},inner);t2.textContent='1948';});
  // sheen band across the numerals
  el('rect',{x:-400,y:200,width:3000,height:700,fill:'url(#sheen)',opacity:.9},inner);
  // dimension line under
  const dy=800;
  el('line',{x1:330,y1:dy,x2:1590,y2:dy,stroke:'#C9D2DE','stroke-opacity':.55});
  [330,1590].forEach(x=>{el('line',{x1:x,y1:dy-14,x2:x,y2:dy+14,stroke:'#C9D2DE','stroke-opacity':.55});});
  el('text',{x:960,y:dy+44,'text-anchor':'middle',fill:'#C9D2DE','font-size':20,'letter-spacing':'.4em','font-family':'Zen Kaku'}).textContent='EST.  1948  —  OKAZAKI, AICHI';
  // end mill parked at end of path
  endmill(1640,350,30);
  el('path',{d:'M1590 520 L1640 380',stroke:'#C9D2DE','stroke-opacity':.3,'stroke-dasharray':'4 8',fill:'none'});
  document.getElementById('xy').innerHTML='X <b>1640.000</b> &nbsp;Y <b>350.000</b> &nbsp;Z <b>+50.000</b>';
  document.getElementById('foot').innerHTML='PASS 214 / 214 &nbsp;— &nbsp;COMPLETE';
}
</script></body></html>

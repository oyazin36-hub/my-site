  const c = document.createElement("div");
  c.className="card"; c.id=id(s.n);
  c.innerHTML = `<div class="top"><span class="num">カット ${s.n}</span><span class="time">${fmt(s.start)}–${fmt(s.end)}（${(s.end-s.start).toFixed(1)}秒）</span><button class="play">▶ 再生</button></div>
  ${s.lyrics.length?`<div class="lyr">♪ ${s.lyrics.join(" / ")}</div>`:""}
  <div class="shots">${s.shots.map(p=>`<img loading="lazy" src="${p}" alt="">`).join("")}</div>
  <div class="desc"></div>
  ${s.issue?`<div class="issue">⚠ </div>`:""}
  <div class="chips">${ACTIONS.map(a=>`<button>${a}</button>`).join("")}</div>
  <textarea placeholder="指示を書く（例：人物を2人減らす／看板の文字を消す）"></textarea>
  <div class="st"></div>`;
  c.querySelector(".desc").textContent = s.desc;
  if (s.issue) c.querySelector(".issue").textContent = "⚠ "+s.issue;
  c.querySelector(".play").onclick = ()=>{v.currentTime=s.start+0.05; v.play(); window.scrollTo({top:0,behavior:"smooth"});};
  c.querySelectorAll(".shots img").forEach(im=>im.onclick=()=>{const z=document.getElementById("zoom");z.querySelector("img").src=im.src;z.style.display="flex";});
  const ta = c.querySelector("textarea"), st = c.querySelector(".st");
  let timer=null, saving=Promise.resolve();
  const save = ()=>{
    if(!db){st.textContent="保存不可：チャットで送ってください";return;}
    const cur = notes[s.n]||{};
    const data = {cut:s.n, action:cur.action||"", text:ta.value.trim(), updated:new Date().toISOString()};
    notes[s.n]=data; paint(c,s.n);
    st.className="st"; st.textContent="保存中…";
    saving = saving.then(()=>db.doc("notes/"+id(s.n)).set(data)).then(()=>{st.className="st ok";st.textContent="✓ 保存しました";},e=>{st.className="st";st.textContent="保存できませんでした（"+(e&&e.code||"error")+"）";});
  };
  c.querySelectorAll(".chips button").forEach(b=>b.onclick=()=>{
    const cur = {...(notes[s.n]||{})}; cur.action = cur.action===b.textContent?"":b.textContent; notes[s.n]=cur;
    clearTimeout(timer); save();
  });
  ta.oninput = ()=>{clearTimeout(timer); timer=setTimeout(save,900);};
  c._ta = ta;
  list.appendChild(c);
}
function paint(c,n){
  const d = notes[n]||{};
  c.querySelectorAll(".chips button").forEach(b=>b.classList.toggle("on",b.textContent===d.action));
  c.classList.toggle("has", !!(d.action&&d.action!=="このまま") || !!d.text);
}
function applyFilter(){
  let cnt=0;
  for (const s of SEGS){
    const c=document.getElementById(id(s.n)); const d=notes[s.n]||{};
    const has=!!(d.action&&d.action!=="このまま")||!!d.text; if(has)cnt++;
    c.style.display = filter==="all"||(filter==="issue"&&s.issue)||(filter==="note"&&has) ? "" : "none";
  }
  document.getElementById("sum").textContent = db ? `指示あり ${cnt} / 52` : "";
}
document.querySelectorAll(".bar button").forEach(b=>b.onclick=()=>{filter=b.dataset.f;document.querySelectorAll(".bar button").forEach(x=>x.classList.toggle("on",x===b));applyFilter();});
document.getElementById("zoom").onclick=e=>e.currentTarget.style.display="none";
applyFilter();
(async()=>{
  try{ db = await window.claude?.use("db"); }catch(e){ db=null; }
  if(!db){document.getElementById("nodb").style.display="block";return;}
  db.collection("notes").onSnapshot(snap=>{
    const docs = snap.docs || snap;
    for (const d of docs){
      const x = typeof d.data==="function"?d.data():d.data||d;
      if(!x||!x.cut) continue;
      notes[x.cut]={...x};
      const c=document.getElementById(id(x.cut));
      if(c && document.activeElement!==c._ta) c._ta.value=x.text||"";
      if(c) paint(c,x.cut);
    }
    applyFilter();
  });
})();
</script>

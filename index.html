<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#2563eb">
  <title>社内帳票管理</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- ヘッダー -->
    <header class="app-header">
      <div class="header-inner">
        <button class="btn-back hidden" id="btnBack" onclick="goBack()">&#8592;</button>
        <h1 id="pageTitle">社内帳票管理</h1>
        <button class="btn-new" id="btnNew" onclick="showFormList()">＋ 新規</button>
      </div>
    </header>

    <!-- ページ: ダッシュボード -->
    <div id="pageDashboard" class="page active">
      <!-- 絞り込みタブ -->
      <div class="tab-bar">
        <button class="tab active" onclick="switchTab(this,'month')">月別</button>
        <button class="tab" onclick="switchTab(this,'employee')">従業員別</button>
        <button class="tab" onclick="switchTab(this,'category')">項目別</button>
      </div>

      <!-- 月セレクタ -->
      <div class="month-selector" id="monthSelector">
        <button onclick="changeMonth(-1)">&#9664;</button>
        <span id="currentMonthLabel"></span>
        <button onclick="changeMonth(1)">&#9654;</button>
      </div>

      <!-- 集計カード -->
      <div class="summary-cards" id="summaryCards">
        <div class="summary-card">
          <div class="summary-label">今月の件数</div>
          <div class="summary-value blue" id="totalCount">—</div>
        </div>
        <div class="summary-card">
          <div class="summary-label">承認待ち</div>
          <div class="summary-value orange" id="pendingCount">—</div>
        </div>
        <div class="summary-card">
          <div class="summary-label">完了</div>
          <div class="summary-value green" id="doneCount">—</div>
        </div>
      </div>

      <!-- 進捗の凡例 -->
      <div class="flow-legend">
        進捗: <span class="step done">総務</span>
        <span class="arrow">→</span>
        <span class="step done">課長</span>
        <span class="arrow">→</span>
        <span class="step done">副社長</span>
        <span class="arrow">→</span>
        <span class="step done">社長</span>
      </div>

      <!-- 依頼一覧 -->
      <div class="list-container" id="requestList">
        <div class="loading">読み込み中...</div>
      </div>
    </div>

    <!-- ページ: 帳票選択 -->
    <div id="pageFormList" class="page">
      <div class="section-title">どの帳票を作成しますか？</div>
      <div class="form-list" id="formList"></div>
    </div>

    <!-- ページ: 入力フォーム -->
    <div id="pageInput" class="page">
      <div id="formContainer"></div>
      <div class="form-actions">
        <button class="btn-confirm" onclick="showConfirm()">内容を確認する</button>
      </div>
    </div>

    <!-- ページ: 確認 -->
    <div id="pageConfirm" class="page">
      <div class="confirm-box" id="confirmBox"></div>
      <div class="form-actions">
        <button class="btn-back-white" onclick="showPage('pageInput')">戻って修正</button>
        <button class="btn-submit" onclick="submitForm()">送信する</button>
      </div>
    </div>

    <!-- ページ: 完了 -->
    <div id="pageComplete" class="page">
      <div class="complete-box">
        <div class="complete-icon">&#10003;</div>
        <div class="complete-title">送信しました</div>
        <div class="complete-sub" id="completeMsg"></div>
        <button class="btn-confirm" onclick="showPage('pageDashboard'); loadDashboard()">一覧に戻る</button>
      </div>
    </div>

    <!-- ページ: 詳細・承認 -->
    <div id="pageDetail" class="page">
      <div id="detailBox"></div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/forms/purchase.js"></script>
  <script src="js/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>スケジュール管理</title>
<style>
  :root{
    --blue:#2E5395; --green:#5BA72B; --yellow:#F4C20D; --wknd:#E4E7F0; --hdr:#404040;
    --input:#FFF2CC; --border:#BFBFBF; --line:#E0E0E0;
    --dayw:24px; --rowh:24px;
  }
  *{box-sizing:border-box;}
  body{font-family:"Meiryo","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;margin:0;color:#222;background:#f6f6f8;font-size:13px;}
  header{background:#fff;border-bottom:1px solid #ddd;padding:8px 14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  header h1{font-size:17px;margin:0;}
  .tabs{display:flex;gap:4px;}
  .tab{padding:6px 14px;border:1px solid #ccc;border-bottom:none;background:#eceff4;cursor:pointer;border-radius:6px 6px 0 0;font-weight:bold;}
  .tab.active{background:#fff;color:var(--blue);box-shadow:0 -2px 0 var(--blue) inset;}
  .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 14px;background:#fff;border-bottom:1px solid #eee;}
  .legend{display:inline-flex;align-items:center;gap:5px;margin-left:6px;}
  .sw{width:16px;height:12px;display:inline-block;border:1px solid #999;}
  button.btn{padding:5px 12px;border:1px solid #bbb;background:#fafafa;border-radius:5px;cursor:pointer;}
  button.btn:hover{background:#eef;}
  button.primary{background:var(--blue);color:#fff;border-color:var(--blue);}
  button.danger{color:#b00;}
  .view{padding:10px 14px;}
  .gridwrap{overflow:auto;border:1px solid var(--border);background:#fff;max-height:74vh;}
  table.gantt{border-collapse:separate;border-spacing:0;table-layout:fixed;}
  table.gantt th,table.gantt td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0;height:var(--rowh);font-weight:normal;background:#fff;}
  .fixcol{position:sticky;z-index:3;background:#fff;}
  thead th.fixcol{z-index:6;}
  thead th{position:sticky;top:0;z-index:4;background:var(--hdr);color:#fff;text-align:center;}
  thead th.month{background:#d9d9d9;color:#222;font-weight:bold;text-align:center;white-space:nowrap;font-size:12px;}
  .lh{background:var(--hdr)!important;color:#fff;font-weight:bold;text-align:center;}
  td.lab{padding:1px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  td.num{text-align:center;}
  .day{width:var(--dayw);min-width:var(--dayw);max-width:var(--dayw);text-align:center;position:relative;}
  .daynum{font-size:11px;color:#333;}
  .wd{font-size:10px;color:#666;}
  .sat .daynum,.sat .wd{color:#1a3fb0;}
  .sun .daynum,.sun .wd{color:#c0392b;}
  td.cell.wknd{background:var(--wknd);}
  td.cell.plan{background:var(--blue);}
  td.cell.act{background:var(--green);}
  td.cell.done{background:var(--yellow);}
  /* continuous bars: hide inner gridlines so labels stay readable */
  td.cell.plan,td.cell.act,td.cell.done{border-right-color:transparent;border-bottom-color:transparent;}
  td.cell{position:relative;}
  /* white text with a dark outline = readable on blue / yellow / green / white alike,
     so labels can spill into empty space to show the full name */
  span.tasklbl{position:absolute;left:2px;top:50%;transform:translateY(-50%);color:#fff;font-size:11px;font-weight:bold;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:inline-block;pointer-events:none;z-index:2;
    text-shadow:-1px -1px 0 rgba(0,0,0,.6),1px -1px 0 rgba(0,0,0,.6),-1px 1px 0 rgba(0,0,0,.6),1px 1px 0 rgba(0,0,0,.6);}
  td.cell.tstart{box-shadow:inset 2px 0 0 rgba(255,255,255,.9);}
  table.gantt.w18 th.day,table.gantt.w18 td.day{width:20px;min-width:20px;max-width:20px;}
  table.gantt.wq th.day,table.gantt.wq td.day{width:54px;min-width:54px;max-width:54px;}
  table.gantt.wmonth th.day,table.gantt.wmonth td.day{width:34px;min-width:34px;max-width:34px;}
  table.gantt.wq td.cell.tstart{box-shadow:inset 2px 0 0 rgba(255,255,255,.95);}
  tr.planrow td{height:26px;}
  tr.actrow td{height:15px;}
  /* thick separators so each task / project is clearly divided */
  tr.tsep > td{border-bottom:2px solid #8a8a8a !important;}
  tr.grpfix > td.fixcol{border-bottom:2px solid #8a8a8a !important;}
  /* project overall target-end (終了予定日) marker */
  .deadline{box-shadow:inset -2px 0 0 #d11;}
  span.dlmark{position:absolute;top:-3px;left:50%;transform:translateX(-50%);color:#d11;font-size:11px;line-height:1;z-index:5;pointer-events:none;text-shadow:0 0 2px #fff,0 0 2px #fff;}
  input,select{font-family:inherit;font-size:12px;border:1px solid #ccc;border-radius:3px;padding:2px 3px;}
  td input.t{width:96%;border:none;background:transparent;}
  td input.t:focus{background:#fffbe6;outline:1px solid var(--blue);}
  td.din{background:var(--input);}
  td.din input{width:96%;border:none;background:transparent;}
  .mono{font-family:Consolas,monospace;}
  .hint{color:#888;font-size:12px;}
  .pname{font-weight:bold;}
  .rowdel{color:#b00;cursor:pointer;border:none;background:none;font-weight:bold;}
  .help{max-width:920px;line-height:1.75;font-size:13.5px;}
  .help h2{font-size:20px;color:var(--blue);border-bottom:2px solid var(--blue);padding-bottom:4px;margin:26px 0 8px;}
  .help h3{font-size:15px;margin:14px 0 4px;}
  .help ol,.help ul{margin:6px 0 8px 24px;}
  .help li{margin:4px 0;}
  .help .chip{display:inline-block;min-width:54px;text-align:center;padding:1px 8px;border-radius:4px;color:#fff;font-weight:bold;font-size:12px;text-shadow:0 1px 1px rgba(0,0,0,.3);}
  .help .step{background:#eef3fb;border-left:4px solid var(--blue);padding:8px 12px;margin:8px 0;border-radius:0 6px 6px 0;}
  .help .note{background:#fff7df;border-left:4px solid var(--yellow);padding:8px 12px;margin:8px 0;border-radius:0 6px 6px 0;}
  .help table.lg{border-collapse:collapse;margin:8px 0;}
  .help table.lg td{border:1px solid #ddd;padding:5px 12px;vertical-align:middle;}
  .help .big{font-size:15px;font-weight:bold;}
  @media print{
    header,.toolbar,.tabs,.noprint{display:none!important;}
    .gridwrap{max-height:none;overflow:visible;border:none;}
    .view{padding:0;}
  }
</style>
</head>
<body>
<header>
  <h1>📅 スケジュール管理</h1>
  <div class="tabs" id="tabs"></div>
</header>
<div class="toolbar" id="toolbar"></div>
<div class="view" id="view"></div>

<script>
"use strict";
/* ================= data model ================= */
const LS_KEY="scheduleAppData_v1";
const COLORS={plan:"#2E5395",act:"#5BA72B",done:"#F4C20D"};
function uid(){return Math.random().toString(36).slice(2,9);}

function seedData(){
  return {
    baseYear:2026,
    monthView:{year:2026,month:5},
    quarterView:{year:2026,month:4},
    projects:[
      {id:uid(),name:"A社_看板リニューアル",owner:"原マシナリ",base:"2026-04-01",targetEnd:"2026-09-30",tasks:[
        {id:uid(),name:"見積取得",owner:"原副社長",start:"2026-04-16",due:"2026-04-22",done:"2026-04-27"},
        {id:uid(),name:"予算書作成",owner:"今井",start:"2026-04-22",due:"2026-04-29",done:"2026-05-08"},
        {id:uid(),name:"発注(納期2か月)",owner:"井上",start:"2026-05-15",due:"2026-05-30",done:""},
        {id:uid(),name:"制作(2か月)",owner:"原副社長",start:"2026-06-01",due:"2026-07-30",done:""},
        {id:uid(),name:"工事",owner:"",start:"2026-08-01",due:"2026-08-31",done:""},
        {id:uid(),name:"運用開始",owner:"",start:"2026-09-01",due:"2026-09-01",done:""},
      ]},
      {id:uid(),name:"B社_QR検品ライン",owner:"佐藤",base:"2026-05-01",targetEnd:"2026-09-30",tasks:[
        {id:uid(),name:"要件定義",owner:"佐藤",start:"2026-05-10",due:"2026-05-20",done:"2026-05-22"},
        {id:uid(),name:"設計",owner:"鈴木",start:"2026-05-21",due:"2026-06-10",done:"2026-06-15"},
        {id:uid(),name:"製作",owner:"工場",start:"2026-06-16",due:"2026-08-20",done:""},
        {id:uid(),name:"導入",owner:"佐藤",start:"2026-08-21",due:"2026-09-15",done:""},
      ]},
      {id:uid(),name:"C社_設備更新",owner:"田中",base:"2026-03-01",targetEnd:"2026-07-15",tasks:[
        {id:uid(),name:"現地調査",owner:"田中",start:"2026-03-01",due:"2026-03-15",done:"2026-03-18"},
        {id:uid(),name:"発注",owner:"田中",start:"2026-03-16",due:"2026-04-15",done:"2026-04-20"},
        {id:uid(),name:"据付工事",owner:"業者",start:"2026-05-01",due:"2026-06-30",done:"2026-07-05"},
        {id:uid(),name:"試運転",owner:"田中",start:"2026-07-01",due:"2026-07-10",done:"2026-07-12"},
      ]},
    ]
  };
}
let DATA=load();
function load(){
  try{const s=localStorage.getItem(LS_KEY);if(s)return JSON.parse(s);}catch(e){}
  return seedData();
}
function save(){try{localStorage.setItem(LS_KEY,JSON.stringify(DATA));}catch(e){}}

/* ================= date utils ================= */
function pd(s){if(!s)return null;const p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2]);}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x;}
function dnum(d){return Math.floor(d.getTime()/86400000);}
function between(d,a,b){return d>=a&&d<=b;}
const WD=["日","月","火","水","木","金","土"]; // getDay():0=Sun
function wdClass(d){const g=d.getDay();return g===0?"sun":(g===6?"sat":"");}
function isWknd(d){const g=d.getDay();return g===0||g===6;}
function mdLabel(s){const d=pd(s);return d?(d.getMonth()+1)+"/"+d.getDate():"";}

/* ================= core (testable) ================= */
// returns "plan" | "act" | "" for a given day & range
function cellState(day, startISO, endISO){
  const s=pd(startISO), e=pd(endISO);
  if(!s||!e) return false;
  return between(day,s,e);
}
function aggregate(p){
  let starts=[],dues=[],dones=[];
  for(const t of p.tasks){
    if(t.start) starts.push(pd(t.start));
    if(t.due) dues.push(pd(t.due));
    if(t.done) dones.push(pd(t.done));
  }
  const mn=starts.length?new Date(Math.min(...starts.map(d=>d.getTime()))):null;
  const mx=dues.length?new Date(Math.max(...dues.map(d=>d.getTime()))):null;
  const dn=dones.length?new Date(Math.max(...dones.map(d=>d.getTime()))):null;
  return {start:mn?iso(mn):"", due:mx?iso(mx):"", done:dn?iso(dn):""};
}

/* ================= rendering helpers ================= */
const el=(t,a,...c)=>{const e=document.createElement(t);if(a)for(const k in a){if(k==="class")e.className=a[k];else if(k==="html")e.innerHTML=a[k];else if(k.startsWith("on"))e.addEventListener(k.slice(2),a[k]);else e.setAttribute(k,a[k]);}for(const x of c){if(x==null)continue;e.append(x.nodeType?x:document.createTextNode(x));}return e;};

let TAB="project", CURPROJ=null;
const TABS=[["project","案件詳細"],["master","年間まとめ"],["quarter","3か月"],["month","月別"],["simple","簡易表"],["data","データ/保存"],["help","❓使い方"]];

function renderTabs(){
  const tb=document.getElementById("tabs");tb.innerHTML="";
  for(const [k,label] of TABS){
    tb.append(el("div",{class:"tab"+(TAB===k?" active":""),onclick:()=>{TAB=k;render();}},label));
  }
}
function legend(){
  return el("span",{},
    el("span",{class:"legend"}, el("span",{class:"sw",style:"background:"+COLORS.plan}), "予定"),
    el("span",{class:"legend"}, el("span",{class:"sw",style:"background:"+COLORS.done}), "完了タスク"),
    el("span",{class:"legend"}, el("span",{class:"sw",style:"background:"+COLORS.act}), "実績"),
    el("span",{class:"legend"}, el("span",{class:"sw",style:"background:var(--wknd)"}), "土日"),
    el("span",{class:"legend"}, el("span",{style:"color:#d11;font-weight:bold"},"▼"), "終了予定日"));
}
/* add a ▼ marker at the project's overall target end date */
function addDeadlineMarker(cells, te, base){
  if(!te) return;
  const off=dnum(pd(te))-dnum(base);
  if(off>=0 && off<cells.length){
    cells[off].classList.add("deadline");
    cells[off].append(el("span",{class:"dlmark",title:"終了予定日 "+mdLabel(te)},"▼"));
  }
}
/* day cells for a project's 予定 row: per-task segments (blue=未完了 / 黄=完了) + labels + ticks */
function planRowCells(p, dates, base, dayW){
  const N=dates.length;
  const dated=p.tasks.filter(t=>t.start&&t.due).slice().sort((a,b)=>pd(a.start)-pd(b.start));
  const color=new Array(N).fill(null), tick=new Array(N).fill(false), label=new Array(N).fill(null);
  dated.forEach((t,i)=>{
    const s=pd(t.start), e=pd(t.due), done=!!t.done;
    for(let di=0;di<N;di++){ if(between(dates[di],s,e)) color[di]=done?"done":"plan"; }
    let so=dnum(s)-dnum(base); const eo=dnum(e)-dnum(base);
    let at=null;
    if(so>=0&&so<N) at=so; else if(so<0&&eo>=0) at=0; // starts before view but visible
    if(at!=null && label[at]==null){
      // slot runs until the next task starts; the last task may use all trailing space.
      // a long name therefore spills into the gap / trailing area instead of being clipped.
      let endo = (i+1<dated.length) ? dnum(pd(dated[i+1].start))-dnum(base) : N;
      const wdays=Math.max(1, Math.min(endo,N)-at);
      label[at]={name:t.name||"(無題)", wdays}; tick[at]=true;
    }
  });
  const cells=[];
  for(let di=0;di<N;di++){
    let cls="day cell"; if(isWknd(dates[di]))cls+=" wknd";
    if(color[di]==="plan")cls="day cell plan"; else if(color[di]==="done")cls="day cell done";
    if(tick[di])cls+=" tstart";
    const td=el("td",{class:cls});
    if(label[di]){ const px=Math.max(12,label[di].wdays*dayW-4);
      td.append(el("span",{class:"tasklbl",style:`max-width:${px}px`,title:label[di].name}, label[di].name)); }
    cells.push(td);
  }
  return cells;
}
/* day cells for a project's 実績(green) row: overall actual span */
function actRowCells(p, dates){
  const ag=aggregate(p); const cells=[];
  for(const d of dates){ let cls="day cell"; if(isWknd(d))cls+=" wknd"; if(cellState(d,ag.start,ag.done))cls="day cell act"; cells.push(el("td",{class:cls})); }
  return cells;
}
/* ---- weekly (1列=1週) versions for the 3-month view ---- */
function weekOverlap(ws, startISO, endISO){
  const s=pd(startISO), e=pd(endISO); if(!s||!e) return false;
  const we=addDays(ws,6); return ws<=e && we>=s;
}
function firstWeekIdx(weeks, dateISO){ // first week whose end is on/after the date
  const d=pd(dateISO); if(!d) return -1;
  for(let i=0;i<weeks.length;i++){ if(addDays(weeks[i],6)>=d) return i; }
  return -1;
}
function planRowCellsWeekly(p, weeks, colW){
  const N=weeks.length;
  const dated=p.tasks.filter(t=>t.start&&t.due).slice().sort((a,b)=>pd(a.start)-pd(b.start));
  const color=new Array(N).fill(null), tick=new Array(N).fill(false), label=new Array(N).fill(null);
  dated.forEach((t,i)=>{
    const done=!!t.done;
    for(let wi=0;wi<N;wi++){ if(weekOverlap(weeks[wi],t.start,t.due)) color[wi]=done?"done":"plan"; }
    let si=firstWeekIdx(weeks,t.start);
    if(si>=0 && si<N && label[si]==null){
      let endi=N;
      if(i+1<dated.length){ const ni=firstWeekIdx(weeks,dated[i+1].start); if(ni>=0) endi=ni; }
      const wk=Math.max(1, Math.min(endi,N)-si);
      label[si]={name:t.name||"(無題)", wk}; tick[si]=true;
    }
  });
  const cells=[];
  for(let wi=0;wi<N;wi++){
    let cls="day cell";
    if(color[wi]==="plan")cls="day cell plan"; else if(color[wi]==="done")cls="day cell done";
    if(tick[wi])cls+=" tstart";
    const td=el("td",{class:cls});
    if(label[wi]){ const px=Math.max(14,label[wi].wk*colW-4);
      td.append(el("span",{class:"tasklbl",style:`max-width:${px}px`,title:label[wi].name}, label[wi].name)); }
    cells.push(td);
  }
  return cells;
}
function actRowCellsWeekly(p, weeks){
  const ag=aggregate(p); const cells=[];
  for(const ws of weeks){ let cls="day cell"; if(weekOverlap(ws,ag.start,ag.done))cls="day cell act"; cells.push(el("td",{class:cls})); }
  return cells;
}
function addDeadlineMarkerWeekly(cells, te, weeks){
  if(!te) return; const d=pd(te);
  for(let i=0;i<weeks.length;i++){ if(d>=weeks[i] && d<=addDays(weeks[i],6)){ cells[i].classList.add("deadline"); cells[i].append(el("span",{class:"dlmark",title:"終了予定日 "+mdLabel(te)},"▼")); break; } }
}

/* day header cells for a daily range */
function dayHeaders(dates){
  const monthRow=[], dayRow=[], wdRow=[];
  let i=0;
  while(i<dates.length){
    let j=i; const m=dates[i].getMonth();
    while(j<dates.length && dates[j].getMonth()===m) j++;
    const span=j-i;
    const lab=(i===0? dates[i].getFullYear()+"/"+(m+1) : (m+1)+"月");
    monthRow.push(el("th",{class:"month",colspan:span},lab));
    i=j;
  }
  for(const d of dates){
    dayRow.push(el("th",{class:"day "+wdClass(d)}, el("div",{class:"daynum"},String(d.getDate()))));
    wdRow.push(el("th",{class:"day "+wdClass(d)}, el("div",{class:"wd"},WD[d.getDay()])));
  }
  return {monthRow,dayRow,wdRow};
}

/* sticky left header cells builder */
function fixTh(text,left,w){return el("th",{class:"fixcol lh",style:`left:${left}px;min-width:${w}px;width:${w}px`},text);}

/* ================= VIEW: project detail ================= */
function viewProject(){
  if(!CURPROJ && DATA.projects[0]) CURPROJ=DATA.projects[0].id;
  const p=DATA.projects.find(x=>x.id===CURPROJ);
  const tbar=document.getElementById("toolbar");tbar.innerHTML="";
  const sel=el("select",{onchange:e=>{CURPROJ=e.target.value;render();}});
  for(const pr of DATA.projects) sel.append(el("option",{value:pr.id,...(pr.id===CURPROJ?{selected:"selected"}:{})},pr.name));
  tbar.append("案件:",sel);
  tbar.append(el("button",{class:"btn",onclick:addProject},"＋案件追加"));
  if(p){
    tbar.append(el("button",{class:"btn",onclick:()=>addTask(p)},"＋タスク追加"));
    tbar.append("　基準日:");
    tbar.append(el("input",{type:"date",value:p.base||"",onchange:e=>{p.base=e.target.value;save();render();}}));
    tbar.append("　終了予定日(全体):");
    tbar.append(el("input",{type:"date",value:p.targetEnd||"",title:"この案件がすべて終わる予定日",onchange:e=>{p.targetEnd=e.target.value;save();render();}}));
    tbar.append(el("button",{class:"btn danger",onclick:()=>delProject(p)},"案件削除"));
  }
  tbar.append(legend());tbar.append(printBtn());
  const wrap=el("div",{class:"gridwrap"});
  if(!p){document.getElementById("view").replaceChildren(wrap);return;}
  const base=pd(p.base)||new Date(DATA.baseYear,0,1);
  const N=365; const dates=[]; for(let i=0;i<N;i++)dates.push(addDays(base,i));
  // column widths
  const cw=[34,150,90,86,86,86]; const lefts=[]; let acc=0; for(const w of cw){lefts.push(acc);acc+=w;}
  const heads=["No","タスク","担当","開始日","締切日","完了日"];
  const tbl=el("table",{class:"gantt"});
  const thead=el("thead");
  // month row
  const r1=el("tr");
  heads.forEach((h,k)=>{ if(k===0) r1.append(el("th",{class:"fixcol lh",style:`left:${lefts[0]}px;min-width:${cw[0]}px;width:${cw[0]}px`,rowspan:3},"No")); else r1.append(el("th",{class:"fixcol lh",style:`left:${lefts[k]}px;min-width:${cw[k]}px;width:${cw[k]}px`,rowspan:3},h)); });
  const dh=dayHeaders(dates);
  addDeadlineMarker(dh.dayRow, p.targetEnd, base); // show 終了予定日 on the date header
  dh.monthRow.forEach(c=>r1.append(c));
  const r2=el("tr"); dh.dayRow.forEach(c=>r2.append(c));
  const r3=el("tr"); dh.wdRow.forEach(c=>r3.append(c));
  thead.append(r1,r2,r3); tbl.append(thead);
  const tb=el("tbody");
  p.tasks.forEach((t,ti)=>{
    const tr=el("tr",{class:"tsep"});
    tr.append(el("td",{class:"fixcol num",style:`left:${lefts[0]}px`}, el("button",{class:"rowdel",title:"削除",onclick:()=>{p.tasks.splice(ti,1);save();render();}},"×"), " "+(ti+1)));
    tr.append(tdInput(t,"name","text",lefts[1]));
    tr.append(tdInput(t,"owner","text",lefts[2]));
    tr.append(tdInput(t,"start","date",lefts[3]));
    tr.append(tdInput(t,"due","date",lefts[4]));
    tr.append(tdInput(t,"done","date",lefts[5]));
    const done=!!t.done;

// timeline auto-fits to span every project so newly added projects always show
function masterTimeline(){
  let starts=[],ends=[];
  for(const p of DATA.projects){
    const ag=aggregate(p);
    if(ag.start)starts.push(pd(ag.start));
    if(ag.due)ends.push(pd(ag.due));
    if(ag.done)ends.push(pd(ag.done));
    if(p.targetEnd)ends.push(pd(p.targetEnd));
  }
  let first,last;
  if(starts.length&&ends.length){
    const mn=new Date(Math.min(...starts.map(d=>d.getTime())));
    const mx=new Date(Math.max(...ends.map(d=>d.getTime())));
    first=new Date(mn.getFullYear(),mn.getMonth(),1);
    last=new Date(mx.getFullYear(),mx.getMonth()+1,0);
  }else{
    first=new Date(DATA.baseYear,0,1); last=new Date(DATA.baseYear,11,31);
  }
  const dates=[];for(let d=new Date(first);d<=last;d=addDays(d,1))dates.push(new Date(d));
  return {first,dates};
}

function monthOverlap(monStart, startISO, endISO){
  const s=pd(startISO), e=pd(endISO); if(!s||!e) return false;
  const me=new Date(monStart.getFullYear(),monStart.getMonth()+1,0);
  return monStart<=e && me>=s;
}

      <li><b>Q. 色（帯）が出ない</b><br>A. そのタスクに<b>開始日と締切日の両方</b>が入っているか確認してください。</li>
      <li><b>Q. 年間まとめに案件が出てこない</b><br>A. その案件に<b>日付の入ったタスクが1つ以上</b>必要です。</li>
      <li><b>Q. 入力した内容が消えた／別PCで見たら空だった</b><br>A. 保存は端末ごとです。「JSON書き出し／読み込み」で移してください。</li>
      <li><b>Q. 最初からやり直したい</b><br>A. 「データ/保存」→「初期化」でサンプルに戻ります（<b>入力は消えます</b>のでご注意）。心配なら先にJSON書き出しを。</li>
      <li><b>Q. 案件やタスクを消したい</b><br>A. 案件は「案件詳細」の「案件削除」、タスクは各行の左にある「×」で削除できます。</li>
    </ul>

  </div>`;
}

/* ================= A3 printing ================= */
function printA3(){
  const view=document.getElementById("view");
  const target=view.querySelector("table")||view.querySelector(".help")||view;
  const cw=target.scrollWidth||target.offsetWidth||1000;
  const ch=target.scrollHeight||target.offsetHeight||700;
  const landscape = cw>=ch;
  const mm=v=>v/25.4*96; // mm -> px @96dpi
  const pageW=mm((landscape?420:297)-12), pageH=mm((landscape?297:420)-12);
  const scale=Math.min(pageW/cw, pageH/ch, 1);
  const old=document.getElementById("__printA3"); if(old)old.remove();
  const st=document.createElement("style"); st.id="__printA3";
  st.textContent=`@page{size:A3 ${landscape?"landscape":"portrait"};margin:6mm;}
  @media print{
    .gridwrap{max-height:none!important;overflow:visible!important;border:none!important;}
    .fixcol,thead th{position:static!important;}
    #view{zoom:${scale};}
  }`;
  document.head.append(st);
  const cleanup=()=>{const e=document.getElementById("__printA3");if(e)e.remove();window.removeEventListener("afterprint",cleanup);};
  window.addEventListener("afterprint",cleanup);
  window.print();
  setTimeout(cleanup,1500);
}
function printBtn(){return el("button",{class:"btn",onclick:printA3},"🖨 A3印刷");}
